; PlatformIO project for ESP32-2432S028 (2.8" 320x240 ILI9341 + XPT2046)
; PC temperature monitor + partial control over WiFi/TCP.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 16 MB flash boards use these; the classic ESP32-2432S028 has 4 MB, so the
; defaults below are safe for both. If your board is 16MB, switch partition to
; huge_app.csv and adjust upload speed.
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
upload_speed = 921600

; ВРЕМЕННО: собрать только standalone-тест шрифта (убрать строку, чтобы вернуть main.cpp)
build_src_filter = +<main.cpp>

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.4.0
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    -std=gnu++17
    -Wall
    ; ---- TFT_eSPI: ST7789V2 240x320 on HSPI (pins via build flags, 3248E0S028/REV R) ----
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SUPPORT_TRANSACTIONS=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    -D HSPI_HOST=1
    ; ---- LVGL configuration override ----
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I .
